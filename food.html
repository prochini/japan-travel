    <h1>美食</h1>

      <button class="filter-chip active" data-region="all">全部地區</button>

    <p class="empty-state" id="empty-state" style="display:none">找不到符合條件的項目，試試其他篩選條件。</p>

<script src="js/data.js?v=20261119-23"></script>
<script src="js/main.js?v=20261119-23"></script>
<script>
  const grid = document.querySelector("#fl-grid");
  const emptyState = document.querySelector("#empty-state");
  const regionFilterBar = document.querySelector("#region-filter");

  let activeRegion = "all";

  Object.entries(REGIONS)
    .filter(([key]) => key === "kansai")
    .forEach(([key, r]) => {
      const btn = document.createElement("button");
      btn.className = "filter-chip";
      btn.dataset.region = key;
      btn.textContent = r.name;
      regionFilterBar.appendChild(btn);
    });

  function setActiveChip(bar, value, attr) {
    bar.querySelectorAll(".filter-chip").forEach((chip) => {
      chip.classList.toggle("active", chip.dataset[attr] === value);
    });
  }

  regionFilterBar.addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-chip");
    if (!btn) return;
    activeRegion = btn.dataset.region;
    setActiveChip(regionFilterBar, activeRegion, "region");
    render();
  });

  function addToPlanner(id) {
    const pending = JSON.parse(localStorage.getItem("jt_pending") || "[]");
    if (!pending.includes(id)) pending.push(id);
    localStorage.setItem("jt_pending", JSON.stringify(pending));
    showToast("已加入待規劃清單，前往「行程規劃」加入天數吧！");
  }

  function render() {
    const filtered = FOOD_LODGING.filter((f) => {
      const regionOk = activeRegion === "all" || f.region === activeRegion;
      return regionOk && f.type === "美食";
    });

    grid.innerHTML = "";
    emptyState.style.display = filtered.length ? "none" : "block";

    filtered.forEach((item) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        ${
          item.photo
            ? `<img class="card-photo" src="${item.photo}" alt="${item.name}" loading="lazy" />`
            : `<div class="placeholder-img" data-label="${item.name}" style="height:160px"></div>`
        }
        <div class="card-body">
          <h3>${item.name}</h3>
          <div class="card-meta"><span class="tag">${REGIONS[item.region].name}</span><span class="tag">${item.type}</span></div>
          ${item.photo ? `<p class="card-photo-note">圖為料理類型示意照，非店家實際照片</p>` : ""}
          <p class="card-desc">${item.desc}</p>
          <div class="card-links">
            ${item.map ? `<a class="card-link" href="${item.map}" target="_blank" rel="noopener">在 Google 地圖查看</a>` : ""}
            <a class="card-link" href="https://www.google.com/search?q=${encodeURIComponent("site:tabelog.com " + item.name)}" target="_blank" rel="noopener">在 Tabelog 查詢</a>
          </div>
          <div class="card-foot">
            <span class="card-cost">約 ¥${item.cost.toLocaleString()}</span>
            <button class="btn btn-primary btn-small" data-add="${item.id}">加入行程</button>
          </div>
        </div>`;
      grid.appendChild(card);
    });
  }

  grid.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-add]");
    if (!btn) return;
    addToPlanner(btn.dataset.add);
  });

  render();
</script>
</body>
