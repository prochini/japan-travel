<script src="js/data.js?v=20261119-27"></script>
<script src="js/main.js?v=20261119-27"></script>
<script>
  const grid = document.querySelector("#attraction-grid");
  const emptyState = document.querySelector("#empty-state");
  const regionFilterBar = document.querySelector("#region-filter");
  const categoryFilterBar = document.querySelector("#category-filter");

  let activeRegion = "all";
  let activeCategory = "all";

  Object.entries(REGIONS).forEach(([key, r]) => {
    const btn = document.createElement("button");
    btn.className = "filter-chip";
    btn.dataset.region = key;
    btn.textContent = r.name;
    regionFilterBar.appendChild(btn);
  });

  const categories = [...new Set(ATTRACTIONS.map((a) => a.category))];
  categories.forEach((c) => {
    const btn = document.createElement("button");
    btn.className = "filter-chip";
    btn.dataset.category = c;
    btn.textContent = c;
    categoryFilterBar.appendChild(btn);
  });

  function setActiveChip(bar, value, attr) {
    bar.querySelectorAll(".filter-chip").forEach((chip) => {
      chip.classList.toggle("active", chip.dataset[attr] === value);
    });
  }

  regionFilterBar.addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-chip");
    if (!btn) return;
    activeRegion = btn.dataset.region;
    setActiveChip(regionFilterBar, activeRegion, "region");
    render();
  });

  categoryFilterBar.addEventListener("click", (e) => {
    const btn = e.target.closest(".filter-chip");
    if (!btn) return;
    activeCategory = btn.dataset.category;
    setActiveChip(categoryFilterBar, activeCategory, "category");
    render();
  });

  function addToPlanner(id) {
    const pending = JSON.parse(localStorage.getItem("jt_pending") || "[]");
    if (!pending.includes(id)) pending.push(id);
    localStorage.setItem("jt_pending", JSON.stringify(pending));
    showToast("已加入待規劃清單，前往「行程規劃」加入天數吧！");
  }

  function render() {
    const filtered = ATTRACTIONS.filter((a) => {
      const regionOk = activeRegion === "all" || a.region === activeRegion;
      const categoryOk = activeCategory === "all" || a.category === activeCategory;
      return regionOk && categoryOk;
    });

    grid.innerHTML = "";
    emptyState.style.display = filtered.length ? "none" : "block";

    filtered.forEach((item) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="placeholder-img" data-label="${item.name}" style="height:160px"></div>
        <div class="card-body">
          <h3>${item.name}</h3>
          <div class="card-meta"><span class="tag">${REGIONS[item.region].name}</span><span class="tag">${item.category}</span></div>
          <p class="card-desc">${item.desc}</p>
          <div class="card-foot">
            <span class="card-cost">${item.cost ? "約 ¥" + item.cost.toLocaleString() : "免費"}</span>
            <button class="btn btn-primary btn-small" data-add="${item.id}">加入行程</button>
          </div>
        </div>`;
      grid.appendChild(card);
    });
  }

  grid.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-add]");
    if (!btn) return;
    addToPlanner(btn.dataset.add);
  });

  render();
</script>
</body>
